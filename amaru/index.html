<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amaru Dubai</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    /* ─────────── FONTS ─────────── */
    @font-face {
      font-family: 'Playfair Display';
      src: url('./PlayfairDisplay.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Poppins';
      src: url('./Poppins.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Open Sans';
      src: url('./OpenSans.ttf') format('truetype');
    }

    html, body {
      height: 100%;
      margin: 0;
      background-color: #0a0a0a;
      overflow: hidden;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      color: #d6c09e;
    }

    /* ─────────── ANIMATIONS ─────────── */
    @keyframes pageFade {
      0% { opacity: 0; filter: blur(8px); }
      100% { opacity: 1; filter: blur(0); }
    }
    .animate-pageFade { animation: pageFade 1.8s ease-out forwards; }

    @keyframes logoDrop {
      0% { opacity: 0; transform: translateY(-120px) scale(0.8); }
      60% { opacity: 1; transform: translateY(10px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-logoDrop { animation: logoDrop 1.5s ease-out forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { animation: fadeUp 1.2s ease forwards; }

    /* ─────────── BUTTON ─────────── */
    .btn-amaru {
      font-family: "Playfair Display";
      position: relative;
      overflow: hidden;
      border: 1px solid #d6c09e;
      color: #d6c09e;
      background: transparent;
      letter-spacing: 2px;
      top: 20%;
      transition: all 0.3s ease;
      padding-left: 50px;
      padding-right: 50px;
      text-align: justify;
      text-justify: inter-word;
      letter-spacing: 4px;
      font-size: 20px;
      padding-top: 9px !important;
    }
    .btn-amaru::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(120deg, #d6c09e, #d6c09e);
      transition: all 0.5s ease;
    }
    .btn-amaru:hover::before { left: 100%; }
    .btn-amaru:hover {
      background-color: #d6c09e;
      color: #000;
      transform: scale(1.03);
      box-shadow: 0 0 12px #d6c09e;
    }

    a { color: #d6c09e; }
  </style>
</head>

<body class="animate-pageFade">

  <!-- FULLSCREEN GRID: 80% hero + 20% video -->
  <div class="h-screen w-full grid grid-rows-[80%_20%]">

    <!-- HERO (80%) -->
    <section class="relative flex flex-col justify-between text-center bg-cover bg-center bg-no-repeat px-6 md:px-12 py-8"
             style="background-image: url('./background.png')">

      <!-- Top: Logo + Button -->
      <div class="relative z-10 flex flex-col items-center pt-6">
        <img src="./logo.png" alt="Amaru Logo"
             class="w-32 sm:w-40 md:w-85 lg:w-85 animate-logoDrop" />

        <a href="form.html"
           class="btn-amaru mt-8 px-8 py-3 text-sm sm:text-base uppercase rounded-md animate-fadeUp [animation-delay:1.2s]">
          Keep Me Informed
        </a>
      </div>

      <!-- Middle: Tagline -->
      <div style="top:7%" class="relative z-10 flex flex-col items-center justify-center flex-grow animate-fadeUp [animation-delay:1.6s]">
        <p class="font-['Poppins'] text-sm sm:text-base md:text-lg lg:text-xl max-w-lg mx-auto leading-relaxed">
          The Serpent Rises – Through Rhythm and Flavor
        </p>
      </div>

      <!-- Bottom: Email -->
      <div style="bottom: -5%;" class="relative z-10 flex justify-center pb-4 sm:pb-6 animate-fadeUp [animation-delay:2s]">
        <a href="mailto:info@amarudubai.com"
           class="text-xs sm:text-sm hover:text-[#f2dab1] transition-colors duration-300">
          info@amarudubai.com
        </a>
      </div>
    </section>

    <!-- VIDEO (20%) -->
    <section class="relative w-full h-full overflow-hidden">
      <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover">
        <source src="./IMG_6541.MP4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
      <div class="relative z-10 flex items-center justify-center h-full">
         
      </div>
    </section>
  </div>

  <!-- Video Toggle Script -->
  <script>
    const video = document.querySelector("video");
    const toggleBtn = document.getElementById("videoToggle");
    let isPlaying = true;
    toggleBtn.addEventListener("click", () => {
      if (isPlaying) {
        video.pause();
        toggleBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-8 sm:w-9 h-8 sm:h-9 text-[#d6c09e]">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M5.25 5.25h3.75v13.5H5.25zM15 5.25h3.75v13.5H15z" />
          </svg>`;
      } else {
        video.play();
        toggleBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-8 sm:w-9 h-8 sm:h-9 text-[#d6c09e]">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8.25 4.5l8.25 7.5-8.25 7.5V4.5z" />
          </svg>`;
      }
      isPlaying = !isPlaying;
    });
  </script>
</body>
</html>
