<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amaru - Keep Me Informed</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        /* ─────────── FONTS ─────────── */
        @font-face {
            font-family: 'Playfair Display';
            src: url('./PlayfairDisplay.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Poppins';
            src: url('./Poppins.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Open Sans';
            src: url('./OpenSans.ttf') format('truetype');
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: #0a0a0a;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #d6c09e;
            background-image: url('./background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ─────────── ANIMATIONS ─────────── */
        @keyframes pageFade {
            0% { opacity: 0; filter: blur(8px); }
            100% { opacity: 1; filter: blur(0); }
        }
        .animate-pageFade {
            animation: pageFade 1.8s ease-out forwards;
        }

        @keyframes logoDrop {
            0% { opacity: 0; transform: translateY(-100px) scale(0.9); }
            60% { opacity: 1; transform: translateY(10px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-logoDrop {
            animation: logoDrop 1.5s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeUp {
            animation: fadeUp 1.2s ease forwards;
        }

        /* ─────────── BUTTON SHIMMER ─────────── */
        .btn-amaru {
            position: relative;
            overflow: hidden;
            border: 1px solid #d6c09e;
            color: #d6c09e;
            background: transparent;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-amaru::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, #d6c09e, #d6c09e);
            transition: all 0.5s ease;
        }
        .btn-amaru:hover::before {
            left: 100%;
        }
        .btn-amaru:hover {
            background-color: #d6c09e;
            color: #000;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(191,163,106,0.7);
        }

        input {
            background: transparent;
            border: 1px solid #d6c09e;
            color: #d6c09e;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #d6c09e;
            box-shadow: 0 0 8px #d6c09e;
            background-color: rgba(255,255,255,0.05);
        }

        /* ─────────── FIXED EMAIL FOOTER ─────────── */
        .email-fixed {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0;
            animation: fadeUp 1.2s ease forwards;
            animation-delay: 2.4s;
        }

        @media (min-width: 640px) {
            .email-fixed {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body class="relative flex flex-col items-center justify-between min-h-screen text-center animate-pageFade">

<!-- Overlay -->
<div class="absolute inset-0 bg-black/50"></div>

<!-- Logo (Top) -->
<div class="relative z-10 mt-8 sm:mt-10 animate-logoDrop">
    <img src="./logo.png" alt="Amaru Logo"
         class="w-32 sm:w-40 md:w-52 lg:w-64 mx-auto" />
</div>

<!-- Centered Form -->
<main class="relative z-10 w-full max-w-md mx-auto px-6 flex-grow flex items-center justify-center">
    <form action="send_mail.php" method="POST" class="w-full space-y-6 animate-fadeUp [animation-delay:1.2s]">
        <div class="animate-fadeUp [animation-delay:1.4s]">
            <input type="text" name="fullname" placeholder="Full Name"
                   class="w-full px-4 py-2.5 rounded-md focus:ring-2 focus:ring-amber-400 transition" required>
        </div>
        <div class="animate-fadeUp [animation-delay:1.6s]">
            <input type="email" name="email" placeholder="Email"
                   class="w-full px-4 py-2.5 rounded-md focus:ring-2 focus:ring-amber-400 transition" required>
        </div>
        <div class="animate-fadeUp [animation-delay:1.8s]">
            <input type="tel" name="phone" placeholder="Phone Number"
                   class="w-full px-4 py-2.5 rounded-md focus:ring-2 focus:ring-amber-400 transition" required>
        </div>

        <!-- Buttons -->
        <div class="flex items-center justify-center gap-4 mt-6 animate-fadeUp [animation-delay:2s]">
            <button type="submit" class="btn-amaru px-6 py-2 uppercase text-sm rounded-md">
                Submit
            </button>
            <a href="index.html" class="btn-amaru px-6 py-2 uppercase text-sm rounded-md">
                Back
            </a>
        </div>
    </form>
</main>

<!-- Fixed Email Footer -->
<div class="email-fixed z-10">
    <a href="mailto:info@amarudubai.com" class="hover:text-[#f2dab1] transition-colors duration-300">
        info@amarudubai.com
    </a>
</div>

</body>
</html>
